<title>Book Checklist</title>
<style>
:root{--bg:#eef1f4;--card:#fbfcfd;--ink:#1c2530;--mut:#66727f;--acc:#1f6f5c;--onacc:#fff;--line:#d9dfe5;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161c;--card:#18212a;--ink:#e8edf2;--mut:#93a0ad;--acc:#5fc3a4;--onacc:#0b1f18;--line:#27323d}}
:root[data-theme="dark"]{--bg:#10161c;--card:#18212a;--ink:#e8edf2;--mut:#93a0ad;--acc:#5fc3a4;--onacc:#0b1f18;--line:#27323d}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:8px}
h1{margin:0;font:700 30px/1.1 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;letter-spacing:-.01em}
#oc{color:var(--mut);font-size:14px;margin-top:4px}
#add{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--acc);color:var(--onacc);font-size:26px;line-height:1;cursor:pointer}
.track{display:block;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.track b{display:block;height:100%;background:var(--acc);transition:width .25s}
#ov-wrap{margin:12px 0 22px}
.card{background:var(--card);border-radius:14px;margin-bottom:14px;overflow:hidden;border:1px solid var(--line)}
.gh{display:grid;grid-template-columns:1fr auto 18px;align-items:center;gap:8px;width:100%;padding:14px 16px 12px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.gn{font:700 21px/1.2 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.gc{color:var(--mut);font-size:14px;font-variant-numeric:tabular-nums}
.chev{color:var(--mut)}
.gh .track{grid-column:1/-1}
ul{list-style:none;margin:0;padding:0}
li{border-top:1px solid var(--line)}
.row{display:flex;gap:14px;align-items:center;width:100%;min-height:60px;padding:10px 16px;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.ck{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);display:grid;place-items:center}
.row.on .ck{background:var(--acc);border-color:var(--acc)}
.row.on .ck::after{content:"✓";color:var(--onacc);font-size:15px;font-weight:700}
.tx{display:flex;flex-direction:column;min-width:0}
.t{font:600 16px/1.25 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
.a{color:var(--mut);font-size:13.5px;margin-top:2px}
.row.on .t{color:var(--mut);text-decoration:line-through;text-decoration-thickness:1px}
.del{display:block;width:100%;padding:14px;border:0;border-top:1px solid var(--line);background:none;color:var(--mut);font:inherit;font-size:14px;cursor:pointer}
.empty{color:var(--mut);text-align:center;padding:40px 0}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
#sheet.show{display:flex}
.panel{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
.panel h2{margin:0 0 6px;font:700 22px "Iowan Old Style",Palatino,Georgia,serif}
.panel p{margin:0 0 14px;color:var(--mut);font-size:14px}
input,textarea{width:100%;font:16px/1.4 inherit;font-family:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
textarea{height:170px;resize:vertical}
.btns{display:flex;gap:10px}
.btns button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);font:600 16px inherit;font-family:inherit;cursor:pointer}
.btns .go{background:var(--acc);border-color:var(--acc);color:var(--onacc)}
#msg{color:#c0392b;font-size:14px;min-height:20px;margin:0 0 8px}
</style>
</head>

<main>
<header>
 <div><h1>Book Checklist</h1><div id="oc"></div></div>

 <div class="panel">

  <textarea id="tx" placeholder="The Hobbit - J.R.R. Tolkien 4.30"></textarea>
  <div id="msg"></div>
  <div class="btns"><button id="cancel">Cancel</button><button class="go" id="imp">Import list</button></div>
 </div>
</div>

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const key=b=>norm(b.t)+'|'+norm(b.a);
const parse=txt=>txt.split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
  let p=l.split('|');
  if(p.length<2){const m=l.match(/^(.*?)(?:\s+[-–—]\s+|\s+by\s+)(.*)$/i);p=m?[m[1],m[2]]:[l,''];}
  const t=p[0].trim();let a=(p[1]||'').trim(),r=p[2]?parseFloat(p[2]):null;
  if(!r){const m=a.match(/\s+(\d\.\d{1,2})$/);if(m){r=parseFloat(m[1]);a=a.slice(0,-m[0].length).trim();}}
  return{t,a,r:r||null};
}).filter(b=>b.t);

let lists=ld('bl_lists',null);
let seen=ld('bl_seen',null)||(lists?['s0','s1']:[]);
lists=lists||[];
Object.entries(SEED).forEach(([n,t],i)=>{
  const id='s'+i;
  if(seen.includes(id))return;
  if(!lists.some(l=>l.name.toLowerCase()===n.toLowerCase()))lists.push({id,name:n,books:parse(t)});
  seen.push(id);
});
sv('bl_lists',lists);sv('bl_seen',seen);
let checks=ld('bl_checks',{});
checks=Object.fromEntries(Object.keys(checks).map(k=>[k.split('|').map(norm).join('|'),1]));
sv('bl_checks',checks);
const open=new Set(lists[0]?[lists[0].id]:[]);

function render(){
  let tot=0,done=0;
  const html=lists.map(l=>{
    const d=l.books.filter(b=>checks[key(b)]).length;tot+=l.books.length;done+=d;
    const pct=l.books.length?Math.round(d/l.books.length*100):0,o=open.has(l.id);
    const rows=o?'<ul>'+l.books.map((b,i)=>`<li><button class="row${checks[key(b)]?' on':''}" data-g="${l.id}" data-i="${i}"><span class="ck"></span><span class="tx"><span class="t">${esc(b.t)}</span><span class="a">${esc(b.a)}${b.r?' · ★ '+b.r.toFixed(2):''}</span></span></button></li>`).join('')+`</ul><button class="del" data-del="${l.id}">Delete this list</button>`:'';
    return `<section class="card"><button class="gh" data-g="${l.id}"><span class="gn">${esc(l.name)}</span><span class="gc">${d} of ${l.books.length}</span><span class="chev">${o?'▾':'▸'}</span><i class="track"><b style="width:${pct}%"></b></i></button>${rows}</section>`;
  }).join('');
  $('#lists').innerHTML=html||'<p class="empty">No lists yet. Tap + to add one.</p>';
  $('#ov').style.width=(tot?done/tot*100:0)+'%';
  $('#oc').textContent=done+' of '+tot+' read';
}

$('#lists').onclick=e=>{
  const r=e.target.closest('[data-i]'),d=e.target.closest('[data-del]'),g=e.target.closest('[data-g]');
  if(d){const l=lists.find(x=>x.id==d.dataset.del);
    if(l&&confirm('Delete “'+l.name+'”?')){lists=lists.filter(x=>x!==l);sv('bl_lists',lists);render();}return;}
  if(r){const l=lists.find(x=>x.id==r.dataset.g),k=key(l.books[r.dataset.i]);
    if(checks[k])delete checks[k];else checks[k]=1;
    sv('bl_checks',checks);render();return;}
  if(g){if(open.has(g.dataset.g))open.delete(g.dataset.g);else open.add(g.dataset.g);render();}
};

const close=()=>{$('#sheet').classList.remove('show');$('#msg').textContent='';};
$('#add').onclick=()=>$('#sheet').classList.add('show');
$('#cancel').onclick=close;
$('#sheet').onclick=e=>{if(e.target.id==='sheet')close();};
$('#imp').onclick=()=>{
  const n=$('#nm').value.trim(),books=parse($('#tx').value);
  if(!n||!books.length){$('#msg').textContent='Enter a genre name and at least one book.';return;}
  const ex=lists.find(l=>l.name.toLowerCase()===n.toLowerCase());
  if(ex){ex.books=books;open.add(ex.id);}
  else{const l={id:'u'+Date.now(),name:n,books};lists.push(l);open.add(l.id);}
  sv('bl_lists',lists);$('#nm').value='';$('#tx').value='';close();render();
};
render();
</script>
</body>
</html>
